name: CI & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome Check (Linter & Formatter)
        run: pnpm run lint

      - name: Build Static Landing Page
        run: pnpm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -d dist/assets || { echo "dist/assets missing"; exit 1; }
          echo "Build artifact verification: PASS"

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Deploy to Cloudflare Pages (elcorazoncomoportal.com)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=elcorazoncomoportal
        continue-on-error: true
